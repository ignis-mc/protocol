[workspace]
name = "protocol"
version = "0.1.0"
description = "The Minecraft: Bedrock Edition protocol in pure Mojo, ported from gophertunnel"
authors = ["ignis-mc contributors"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/ignis-mc/protocol"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
mojo = ">=1.2.0,<1.3.0"

[tasks]
test = { cmd = "bash scripts/run_tests.sh", description = "Run every unit test file" }
format = { cmd = "mojo format src test examples", description = "Format all Mojo sources" }
format-check = { cmd = "bash scripts/check_format.sh", description = "Fail if formatting would change anything" }
lint-docs = { cmd = "for p in minecraft tls http net; do mojo doc -I src -I third_party/nethernet/src --diagnose-missing-doc-strings --Werror -o /dev/null src/$p || exit 1; done", description = "Fail on missing or malformed docstrings" }
build = { cmd = "mkdir -p build && for p in minecraft tls http net; do mojo precompile -I src -I third_party/nethernet/src src/$p -o build/$p.mojoc || exit 1; done", description = "Precompile the packages" }
check = { depends-on = ["format-check", "lint-docs", "test"], description = "Everything CI runs except interop" }

# The Dragonfly server, the gophertunnel reference bot and the Xbox Live
# token helper are Go programs.
[feature.interop.dependencies]
go = ">=1.26"

[feature.interop.tasks]
interop = { cmd = "bash interop/run.sh", description = "Join a local Dragonfly server with the Mojo bot" }

[environments]
interop = ["interop"]
